[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sachinross-vidgen_jd030"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对文生视频工程师·向量索引的召回与构建代价相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sachinross" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://sachinross.github.io"
Repository = "https://github.com/sachinross/vidgen_jd030"
Issues = "https://github.com/sachinross/vidgen_jd030/issues"

[project.scripts]
vidgen_jd030 = "vidgen_jd030:main"

[tool.setuptools]
py-modules = ["vidgen_jd030"]
